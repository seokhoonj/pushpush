[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pushpush"
version = "0.2.3"
description = "Send a message to Telegram, Slack, or Discord through one call, with the service's own limits checked before anything is sent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
# No runtime dependencies on purpose: urllib, json, tomllib, and mimetypes carry
# the whole package, and a notifier that never breaks on someone else's release is
# worth more than any convenience a third party would add.
dependencies = []

[project.scripts]
pushpush = "pushpush.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pushpush"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# The provider tables and keyword-argument blocks are aligned on purpose; the
# formatter would collapse that alignment, so formatting stays advisory here.
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# Tests get the real checks but not the annotation ceremony: `-> None` on every
# test function is noise, and a test's signature is never the thing under review.
# The package itself is strict without exception -- it is the part with a contract.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
