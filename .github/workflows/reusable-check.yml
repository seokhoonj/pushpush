name: reusable check

# The full check -- tests, lint, types, and the wheel-integrity assertions --
# factored into one reusable job so both `check.yml` (on push / PR) and the
# release gate in `publish.yml` run the *identical* thing. One definition is what
# makes "publish gates on the full check" true (PYTHON constitution Ch1 §1.8); a
# second hand-maintained copy would drift, and a check added here silently would
# not gate releases.

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. requires-python says >=3.11, so 3.11 is
        # the version that claim has to actually hold on; the upper end tracks whatever
        # CPython currently ships, since >=3.11 promises every release above it.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install
        # A venv per matrix version, not `uv pip --system`: the runner's system
        # Python is externally managed and is one fixed version whatever the matrix
        # says. This is also what the README tells a person to run.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
          .venv/bin/python -c "import sys; print('testing on', sys.version)"

      - name: Test
        run: .venv/bin/pytest -q

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Types
        run: .venv/bin/mypy

      - name: Confirm the package still has no runtime dependencies
        # The zero-dependency claim is in the README and the pyproject comment; a
        # claim nothing checks quietly stops being true. Installed into a bare
        # environment, pushpush must import with nothing else present.
        run: |
          uv venv /tmp/bare --python ${{ matrix.python-version }}
          uv pip install --python /tmp/bare/bin/python .
          /tmp/bare/bin/python -c "
          import importlib.metadata as md
          requires = md.requires('pushpush') or []
          runtime = [r for r in requires if 'extra ==' not in r]
          assert not runtime, f'runtime dependencies appeared: {runtime}'
          import pushpush
          print('pushpush', pushpush.__version__, 'imports with no third-party packages')
          "

      - name: Confirm the console script installed
        # pyproject declares a `pushpush` entry point; a wheel that dropped it would
        # leave the skill and the docs pointing at a command that is not there.
        run: |
          uv venv /tmp/cli --python ${{ matrix.python-version }}
          uv pip install --python /tmp/cli/bin/python .
          /tmp/cli/bin/pushpush --version

      - name: Confirm a user's type checker can see the hints
        # Every hint in this package is invisible to a user unless py.typed ships
        # alongside it (PEP 561), and the source cannot answer whether it did:
        # src/pushpush/py.typed can sit in git while the built wheel omits it. So
        # ask it the way a user does -- install the built package into a clean
        # environment and run their checker over their code.
        run: |
          uv venv /tmp/typed --python ${{ matrix.python-version }}
          uv pip install --python /tmp/typed/bin/python . mypy
          cat > /tmp/user_code.py <<'PY'
          from pushpush import send

          send("hi", markup="bogus")  # markup is a Literal; "bogus" is not one of it
          PY
          /tmp/typed/bin/mypy /tmp/user_code.py > /tmp/mypy_out 2>&1 || true
          cat /tmp/mypy_out
          grep -q 'markup' /tmp/mypy_out
          grep -q 'Literal' /tmp/mypy_out
